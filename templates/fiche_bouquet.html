<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détail du Bouquet - {{ bouquet.modele }}</title> 
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
<header>
    <nav>
        <div class="logo"><a href="/accueil">FLEUROPA</a></div>
        <ul class="nav-links">
            <li><a href="/accueil">Accueil</a></li>
            <li><a href="/bouquets">Bouquets</a></li>
        </ul>
    </nav>
</header>

<main>
    <form action="/ajout_bouquet/{{ bouquet.idbouquet }}" method="POST">
    <div class="magasin-detail-card" style="max-width: 800px; display: flex; gap: 40px; text-align: left;">
        
        <div style="flex: 1; min-width: 300px;">
            <img src="{{ url_for('static', filename=bouquet.photobouquet) }}" 
                 alt="Image du bouquet {{ bouquet.modele }}" 
                 style="width: 100%; height: auto; border-radius: 8px; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);">
        </div>

        <div class="magasin-info" style="flex: 2; padding: 0;">
            
            <h2 style="font-size: 2rem; color: #573b8a; border-bottom: none; padding-bottom: 0;">
                {{ bouquet.modele }}
            </h2>
            
            <h3 style="font-size: 1.8rem; font-weight: bold; color: #38761d; margin-bottom: 30px;">
                {{ bouquet.prixunitaire }} €
            </h3>

            <h3>
                <label for="quantite" style="font-weight: bold; display: block; margin-bottom: 5px;">
                    Quantité :
                </label>
                <input type="number" id="quantite" name="quantite" value="1" min="1" max="100" >
            </h3>


            <p><strong>Taille :</strong> {{ bouquet.taille }}</p>
            <p><strong>Référence (ID) :</strong> {{ bouquet.idbouquet }}</p>
            
            
            <p style="font-style: italic; color: #666;">
                Description : {{bouquet.description}}
            </p>
            
            <button type=submit  class = "btn" style="background-color: #871945; margin-top: 10px; display: block; text-align: center;">
                Ajouter à la Commande
            </button>
            
            <a href="/bouquets" class="btn" 
               style="background-color: #999; margin-top: 10px; display: block; text-align: center;">
                ← Retour au Catalogue
            </a>
        </div>
    </div>
    </form>
</main>

<footer>
    <p>© 2024 Fleuropa — Tous droits réservés</p>
</footer>

</body>
</html>
